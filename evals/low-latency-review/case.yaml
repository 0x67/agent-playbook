schema_version: "1.1"
name: low-latency-review
description: A hot-path review loads low-latency and flags per-message allocation, per-message logging, and the unbounded queue.
tags: [rust, low-latency]
context:
  scaffold_script: fixture.sh
execution:
  max_turns: 14
  allowed_tools: [Read, Glob, Grep, Skill]
  prompt: |
    src/feed.rs is the receive loop of our market-data feed and its p99 latency is too high. Review it and give me a
    short list of concrete changes. Do not edit anything.
graders:
  - name: skill-fired
    type: tool_used
    tool: Skill
    input_match: '"skill"\s*:\s*"(?:[\w-]+:)?low-latency"'
    arm: both
  - name: finds-hot-path-costs
    type: llm
    criteria: |
      PASS if the review flags at least three of: the per-message `to_vec` copy of the frame, the per-message `String`
      allocation for the symbol, the per-message `log::info!` with Debug formatting of the frame, the `unbounded()`
      channel with no overflow or back-pressure policy, and the missing length check before slicing a short datagram;
      AND it says the change should be checked with before and after numbers (a benchmark or a latency histogram with
      percentiles). FAIL if it misses that measurement step or names fewer than three of the listed problems.
