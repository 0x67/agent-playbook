schema_version: "1.1"
name: spec-driven
description: A spec request loads spec-driven and writes the spec into specs/<slug>/.
tags: [workflow, spec]
context:
  scaffold_script: fixture.sh
execution:
  max_turns: 25
  allowed_tools: [Read, Glob, Grep, Skill, Write, Edit]
  prompt: |
    Before any code, write a spec for adding per-user rate limiting to the login handler in server.py. Write only the spec's requirements for now.
graders:
  - name: skill-fired
    type: tool_used
    tool: Skill
    input_match: '"skill"\s*:\s*"(?:[\w-]+:)?spec-driven"'
    arm: both
  - name: requirements-file
    type: file_exists
    path: specs/*/requirements.md
    exists: true
