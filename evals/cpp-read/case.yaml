schema_version: "1.1"
name: cpp-read
description: Reading C++ code loads the cpp skill, and the answer finds the full-buffer check bug.
tags: [lang, cpp, hooks]
context:
  scaffold_script: fixture.sh
execution:
  max_turns: 12
  allowed_tools: [Read, Glob, Grep, Skill]
  prompt: |
    Review push() in ring_buffer.hpp. What happens when the buffer is full? Do not change any files.
graders:
  - name: skill-fired
    type: tool_used
    tool: Skill
    input_match: '"skill"\s*:\s*"(?:[\w-]+:)?cpp"'
    arm: both
  - name: finds-full-check-bug
    type: llm
    criteria: |
      PASS if the answer explains that the check `size_ > N` lets a push succeed when size_ == N, which overwrites the
      oldest element at head_ and grows size_ past N, and that the check should be `size_ >= N` (or `size_ == N`).
      FAIL otherwise.
