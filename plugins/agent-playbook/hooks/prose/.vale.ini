# vale-ai-tells v1.37.0 (MIT), vendored in styles/ai-tells. Rules set to suggestion fired mostly on
# legitimate text in a 3,400-word spec and 164 UI strings; the hook reports warning and above.
StylesPath = styles
MinAlertLevel = warning

[*.{md,mdx,txt,html}]
BasedOnStyles = ai-tells
TokenIgnores = (\{\{[^}]*\}\}), (`[^`\n]+`)
ai-tells.VerbTricolon = suggestion
ai-tells.FormalTransitions = suggestion
ai-tells.SemicolonUsage = suggestion
ai-tells.ColonUsage = suggestion
ai-tells.AnthropomorphicCognition = suggestion
ai-tells.NounString = suggestion
