schema_version: "1.1"
name: services-security
description: A review of request handlers loads services and names the injection, authorization, password, SSRF, and deserialization problems.
tags: [services, security]
context:
  scaffold_script: fixture.sh
execution:
  max_turns: 12
  allowed_tools: [Read, Glob, Grep, Skill]
  prompt: |
    Review the request handlers in api.py: input handling, authorization, password storage, and the outbound avatar fetch. Give me a short list of concrete changes. Do not edit anything.
graders:
  - name: skill-fired
    type: tool_used
    tool: Skill
    input_match: '"skill"\s*:\s*"(?:[\w-]+:)?services"'
    arm: both
  - name: names-real-problems
    type: llm
    criteria: |
      PASS if the review flags at least five of: (1) `get_order` builds SQL with an f-string (injection) and checks no
      ownership of the order; (2) `update_profile` takes the actor from `user_id` in the body; (3) `update_profile`
      copies every body field onto the user (mass assignment, for example a role or balance); (4) `hash_password` uses
      unsalted SHA-256 where Argon2id, scrypt, or bcrypt belongs; (5) `export_dir` runs a shell string built from input;
      (6) `fetch_avatar` fetches a caller-supplied URL with no allowlist or private-address block (SSRF);
      (7) `load_session` unpickles a cookie. FAIL if it gives only generic advice without pointing at these.
