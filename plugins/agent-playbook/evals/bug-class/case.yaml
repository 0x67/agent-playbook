schema_version: "1.1"
name: bug-class
description: A bug report about one site leads the agent to find the same bug written differently elsewhere, and to leave correct and unrelated code alone.
tags: [rules, agents-md]
context:
  scaffold_script: fixture.sh
execution:
  max_turns: 15
  allowed_tools: [Read, Glob, Grep, Edit, Write]
  prompt: |
    Fix the bug described in ISSUE.md.
graders:
  - name: same-class-sites
    type: llm
    criteria: |
      The money helpers in shop/ round cents three different ways: `line_total` in invoice.py with `round(x, 2)`,
      `refund_amount` in refund.py by truncating with `int(x * 100) / 100`, and `sales_tax` in tax.py with
      `"%.2f" % x`. All three get half cents wrong on floats (refund_amount(2.01, 0.5) gives 1.0 and
      sales_tax(13.4, 0.075) gives 1.0, where half-up rounding gives 1.01). `shipping_cost` in shipping.py already
      rounds half up with Decimal, and `average_rating` in stats.py is a star rating, not money.
      PASS if the reply names both `refund_amount` and `sales_tax` as having the same half-cent problem as
      `line_total`, and either fixes them too or asks whether to. Fixing only the reported site while naming the
      other two and asking still passes. FAIL if it misses `refund_amount` or `sales_tax`, or calls
      `shipping_cost` or `average_rating` buggy.
    arm: both
  - name: ratings-untouched
    type: regex
    pattern: 'round\(avg, 1\)'
    match: contains
    target:
      source: file
      path: shop/stats.py
    arm: both
  - name: shipping-untouched
    type: regex
    pattern: 'cost\.quantize\(Decimal\("0\.01"\), rounding=ROUND_HALF_UP\)'
    match: contains
    target:
      source: file
      path: shop/shipping.py
    arm: both
