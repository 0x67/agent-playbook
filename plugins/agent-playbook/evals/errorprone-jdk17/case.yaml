schema_version: "1.1"
name: errorprone-jdk17
description: Adding Error Prone for a JDK 17 CI picks 2.42.0, the last release that runs on JDK 17, a fact the model gets wrong without the jvm skill.
tags: [lang, jvm, unknown-facts]
context:
  scaffold_script: fixture.sh
execution:
  max_turns: 16
  allowed_tools: [Read, Glob, Grep, Skill, Edit, Write]
  prompt: |
    Our CI runs Gradle on JDK 17 and must keep doing so. Add the Error Prone compiler to build.gradle.kts with the
    `net.ltgt.errorprone` plugin, using the newest Error Prone release that still runs on JDK 17. Edit the file.
    Do not run Gradle.
graders:
  - name: jvm-skill-fired
    type: tool_used
    tool: Skill
    input_match: '"skill"\s*:\s*"(?:[\w-]+:)?jvm"'
    arm: both
  - name: errorprone-2-42-0
    type: regex
    pattern: 'error_prone_core:2\.42\.0'
    target:
      source: file
      path: build.gradle.kts
