schema_version: "1.1"
name: jvm-java26
description: Moving a Gradle build to Java 26 picks the oldest Gradle, Kotlin, and Lombok versions that support it, facts the model gets wrong without the jvm skill.
tags: [lang, jvm, unknown-facts]
context:
  scaffold_script: fixture.sh
execution:
  max_turns: 16
  allowed_tools: [Read, Glob, Grep, Skill, Edit, Write]
  prompt: |
    Move this build from Java 24 to Java 26. Change the toolchain, and raise the Gradle wrapper, the Kotlin plugin,
    and Lombok to the oldest versions that support Java 26. Edit the files. Do not run Gradle.
graders:
  - name: jvm-skill-fired
    type: tool_used
    tool: Skill
    input_match: '"skill"\s*:\s*"(?:[\w-]+:)?jvm"'
    arm: both
  - name: gradle-9-4-0
    type: llm
    criteria: |
      PASS if the run either sets the Gradle wrapper to 9.4.0 in gradle/wrapper/gradle-wrapper.properties or tells
      the user to run `./gradlew wrapper --gradle-version 9.4.0` (or names 9.4.0 as the wrapper version to use).
      FAIL if it names any other Gradle version as the oldest that supports Java 26, or leaves Gradle unaddressed.
  - name: kotlin-2-4-0
    type: regex
    pattern: 'kotlin\("jvm"\) version "2\.4\.0"'
    target:
      source: file
      path: build.gradle.kts
  - name: lombok-1-18-46
    type: regex
    pattern: 'lombok:1\.18\.46'
    target:
      source: file
      path: build.gradle.kts
