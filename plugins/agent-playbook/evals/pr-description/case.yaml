schema_version: "1.1"
name: pr-description
description: PR prose follows the humanizer card and the no-attribution rule.
tags: [rules, humanizer]
context:
  scaffold_script: fixture.sh
execution:
  max_turns: 8
  allowed_tools: [Read, Glob, Grep, Skill]
  prompt: |
    Write the pull request description for the change in change.diff. Reply with the description only.
graders:
  - name: no-em-dash
    type: regex
    pattern: '\u2014'
    match: not_contains
    arm: both
  - name: no-attribution
    type: regex
    pattern: 'co-authored-by|generated with|generated by'
    flags: i
    match: not_contains
    arm: both
  - name: plain-prose
    type: llm
    criteria: |
      PASS if the description states what changed (expired cache entries are no longer returned by get) in plain
      sentences, without hype words (robust, seamless, crucial, enhance, leverage), without "not just X but Y" contrasts,
      and without a closing summary line that repeats the point. FAIL otherwise.
    arm: both
