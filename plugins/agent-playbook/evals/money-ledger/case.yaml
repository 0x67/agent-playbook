schema_version: "1.1"
name: money-ledger
description: A review of wallet code loads money and names the float, overdraft, ledger edit, split, and payout scale problems.
tags: [design, money]
context:
  scaffold_script: fixture.sh
execution:
  max_turns: 12
  allowed_tools: [Read, Glob, Grep, Skill]
  prompt: |
    Review wallet.py: how it handles money amounts, fees, balances, the ledger, refunds, and payouts. Give me a short list of concrete changes. Do not edit anything.
graders:
  - name: skill-fired
    type: tool_used
    tool: Skill
    input_match: '"skill"\s*:\s*"(?:[\w-]+:)?money"'
    arm: both
  - name: names-real-problems
    type: llm
    criteria: |
      PASS if the review flags at least four of: (1) amounts and the fee rate are binary floats with `round()`, where
      integer minor units or a decimal type belong; (2) `withdraw` reads the balance, checks it, then writes it back,
      which races under concurrency and can overdraw (it also leaves the fee out of the check), so the check belongs
      in the write (conditional update or lock); (3) `correct_fee` edits a posted ledger entry, where a reversing entry
      plus a new entry belongs; (4) `split_refund` returns parts that do not add up to the total (100.00 / 3), so the
      remainder needs allocating; (5) the rounding mode in `fee_for` is picked in code with no business rule behind it.
      FAIL if it gives only generic advice without pointing at these.
  - name: catches-payout-scale
    type: llm
    criteria: |
      PASS if the review says that `resend_failed_payout` sends `settlement_minor` at the app's 4-decimal scale while
      `send_payout` converts to the bank's 2-decimal scale, so a resent payout is 100 times too large, and that both
      paths should build the amount with one shared conversion. FAIL if it does not point out this mismatch.
